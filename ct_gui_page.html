<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CT Segmentation</title>
<style>
:root{
  /* A warm paper ground rather than white - the same page for hours is easier to read
     off a slightly tinted background, and the surfaces stay distinguishable because
     cards sit lighter than the page instead of the other way round. */
  --ink:#211f1b; --mid:#6a655c; --faint:#9d9689; --line:#e3ddd1; --bg:#f6f2ea;
  --surface:#fdfbf7; --panel:#efe9dd; --edge:#d6cec0;
  --accent:#1a7d3c; --accentdim:#e2eee0; --warn:#b23b2b; --warnbg:#f8e6e1;
  --amber:#9d6f16; --amberbg:#f6eed7;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:Charter,"Iowan Old Style","Source Serif Pro",Georgia,Cambria,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);
  font-size:19px;line-height:1.58;-webkit-font-smoothing:antialiased}
h1,h2,h3,button,label,th,.ui{font-family:var(--sans)}
h1{font-size:34px;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px;font-weight:700}
h2{font-size:23px;letter-spacing:-.01em;margin:34px 0 10px;font-weight:600}
h3{font-size:16px;margin:0 0 4px;font-weight:600}
p{margin:0 0 14px;color:var(--ink)}
.sub{color:var(--mid);font-size:17px;margin:0 0 26px}
a{color:inherit}
header{border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:34px}
header .in{max-width:840px;margin:0 auto;padding:0 22px;display:flex;
  align-items:center;gap:14px}
.brand{font-family:var(--sans);font-weight:700;letter-spacing:-.02em;font-size:19px;
  cursor:pointer}
.brand:hover{opacity:.7}
.crumb{color:var(--faint);font-family:var(--sans);font-size:14px}
main{max-width:840px;margin:0 auto;padding:0 22px 90px}
button{font-size:14px;font-weight:500;padding:8px 16px;border-radius:99px;
  border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;
  transition:opacity .15s}
button:hover:not(:disabled){opacity:.82}
button.ghost{background:var(--surface);color:var(--ink);border-color:var(--edge)}
button.quiet{background:transparent;color:var(--mid);border-color:transparent;
  padding:6px 8px;text-decoration:underline}
button:disabled{opacity:.45;cursor:default}
button.busy{background:var(--mid);border-color:var(--mid)}
input[type=text],input[type=search]{font-family:var(--sans);font-size:15px;
  padding:9px 12px;border:1px solid var(--edge);border-radius:6px;width:100%;
  background:var(--surface);color:var(--ink)}
input[type=text]:focus,input[type=search]:focus{outline:2px solid var(--accentdim);
  border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:0 0 12px;
  background:var(--surface)}
.card.click{cursor:pointer;transition:border-color .15s,background .15s}
.card.click:hover{border-color:var(--edge);background:#fffdfa}
.meta{color:var(--mid);font-size:14px;font-family:var(--sans)}
.pill{display:inline-block;font-family:var(--sans);font-size:12px;padding:2px 9px;
  border-radius:99px;background:var(--panel);color:var(--mid);margin:0 5px 5px 0}
.pill.on{background:var(--accentdim);color:var(--accent)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.amber{background:var(--amberbg);color:var(--amber)}
.empty{border:1px dashed var(--edge);border-radius:10px;padding:40px 22px;text-align:center;
  color:var(--mid)}
table{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:14px}
th{text-align:left;font-weight:600;color:var(--mid);border-bottom:1px solid var(--line);
  padding:7px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
td{padding:8px;border-bottom:1px solid #ece6da;vertical-align:top}
tr.sel td{background:var(--accentdim)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
#log{background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:12px 14px;height:340px;overflow:auto;white-space:pre-wrap;word-break:break-word}
#log div{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12.5px;line-height:1.5;color:#3b382f}
#log div.cmd{color:var(--faint)}
#log div.bad{color:var(--warn)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #fff6;
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;
  vertical-align:-2px;margin-right:7px}
.spin.dark{border:2px solid #0002;border-top-color:var(--mid)}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{height:4px;background:var(--panel);border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.tasklist{max-height:400px;overflow:auto;border:1px solid var(--line);border-radius:8px;
  background:var(--surface)}
.tasklist label{display:flex;gap:11px;padding:10px 14px;border-bottom:1px solid #ece6da;
  cursor:pointer;align-items:flex-start}
.tasklist label:hover{background:var(--panel)}
.tasklist input{margin-top:4px}
.tname{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px}
.tblurb{color:var(--mid);font-size:13px;font-family:var(--sans)}
.note{background:var(--panel);border-left:3px solid var(--line);padding:11px 15px;
  color:var(--mid);font-size:15px;margin:0 0 16px}
.note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#8a2b21}
.note.amber{background:var(--amberbg);border-left-color:var(--amber);color:#7a5410}
canvas{border:1px solid var(--line);border-radius:6px;cursor:crosshair;
  image-rendering:pixelated;max-width:100%}
.hide{display:none}
/* Click-to-edit text. Nothing about a line of prose says it can be clicked, so the
   affordance has to arrive on hover: a tinted panel, an underline and a pencil. The
   padding is cancelled by an equal negative margin and the underline is present but
   transparent at rest, so none of it moves the text when it appears. */
.editable{cursor:text;display:inline-block;max-width:100%;
  padding:2px 7px;margin:-2px -7px;border-radius:6px;
  border-bottom:1px dashed transparent;transition:background .12s,border-color .12s}
.editable:hover,.editable:focus{background:var(--panel);border-bottom-color:var(--edge);
  outline:none}
.editable::after{content:"✎";font-family:var(--sans);font-size:13px;color:var(--faint);
  margin-left:9px;opacity:0;transition:opacity .12s}
.editable:hover::after,.editable:focus::after{opacity:1}
.reasons{color:var(--faint);font-size:12px;font-family:var(--sans)}
.right{margin-left:auto}
/* ---- slice viewer. Two columns: the structure list and the image. Wider than the
   reading column the rest of the tool uses, hence body.wide, set by route(). */
body.wide main{max-width:1180px}
.vwrap{display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start}
.vwrap.hide,.vrow[hidden],.vgrp[hidden]{display:none}
.vside{border:1px solid var(--line);border-radius:10px;background:var(--surface);
  padding:10px;display:flex;flex-direction:column;gap:8px}
.vtree{overflow:auto;flex:1;min-height:120px;max-height:min(60vh,560px)}
.vgrp{border-top:1px solid var(--line);padding-top:5px;margin-top:5px}
.vgrp:first-child{border-top:0;margin-top:0;padding-top:0}
.vgrph,.vrow{display:flex;align-items:center;gap:6px;font-family:var(--sans);
  font-size:13px;border-radius:5px;cursor:pointer}
.vgrph{font-weight:600;padding:3px 4px}
.vrow{padding:2px 4px 2px 15px;color:var(--mid)}
.vgrph:hover,.vrow:hover{background:var(--panel)}
.vrow.on{color:var(--ink)}
.vsw{width:11px;height:11px;border-radius:3px;flex:none;opacity:.25}
.vrow.on .vsw{opacity:1}
.veye{flex:none;width:15px;text-align:center;opacity:.25;font-size:11px}
.vrow.on .veye,.vgrph.on .veye{opacity:.9}
.vname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vcount{margin-left:auto;color:var(--faint);font-size:11px;font-weight:400}
.vcar{flex:none;width:10px;color:var(--faint);font-size:10px}
.vstage{position:relative;background:#0b0b0c;border-radius:8px;
  height:min(64vh,600px);display:flex;align-items:center;justify-content:center;
  overflow:hidden;cursor:crosshair;user-select:none;touch-action:none}
.vstage:focus{outline:2px solid var(--accent);outline-offset:2px}
.vstage img{display:block;pointer-events:none}
/* .hide is a single class and loses to the rules above on specificity */
.vstage img.hide,.vstage canvas.hide{display:none}
.vbusy{position:absolute;top:9px;right:12px;color:#fff;opacity:.7;font-size:12px;
  font-family:var(--sans)}
.vempty{color:var(--faint);font-family:var(--sans);font-size:13px;padding:8px 4px}
.v3d{border:0;border-radius:8px;image-rendering:auto;max-width:none;display:block;
  cursor:grab;touch-action:none}
.v3d.drag{cursor:grabbing}
.vcap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:340px;
  text-align:center;color:#e8e2d6;font-family:var(--sans);font-size:13px;line-height:1.5}
.stack>*+*{margin-top:9px}
</style>
</head>
<body>
<header><div class="in">
  <span class="brand" id="brand" title="back to your projects">CT Segmentation</span>
  <span class="crumb" id="crumb"></span>
  <span class="right"><button class="quiet" id="navHome">All projects</button></span>
</div></header>
<main>
  <div id="view"></div>
</main>

<script>
const TOKEN = "__TOKEN__";
const $ = (h) => { const t = document.createElement("template");
                   t.innerHTML = h.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const view = document.getElementById("view");
const crumb = document.getElementById("crumb");
let POLL = null;

async function api(path, body) {
  const opt = body
    ? {method:"POST", headers:{"Content-Type":"application/json","X-Token":TOKEN},
       body: JSON.stringify(Object.assign({token:TOKEN}, body))}
    : {headers:{"X-Token":TOKEN}};
  const sep = path.includes("?") ? "&" : "?";
  const r = await fetch(path + sep + "token=" + encodeURIComponent(TOKEN), opt);
  const j = await r.json().catch(() => ({error:"the server sent something unreadable"}));
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

/* Every click must change something immediately, before the server answers - a button
   that looks identical for two seconds reads as a dead button. */
function pending(btn, label) {
  if (!btn) return () => {};
  const html = btn.innerHTML, dis = btn.disabled;
  btn.disabled = true; btn.classList.add("busy");
  btn.innerHTML = '<span class="spin"></span>' + esc(label || "Working…");
  return () => { btn.innerHTML = html; btn.disabled = dis;
                 btn.classList.remove("busy"); };
}
function stopPoll() { if (POLL) { clearInterval(POLL); POLL = null; } }
function fmtTime(s) {
  s = Math.round(s);
  return s < 60 ? s + "s" : Math.floor(s/60) + "m " + String(s%60).padStart(2,"0") + "s";
}

/* The back button should mean what it means on every other site. Each screen worth
   returning to owns a hash, and the hash is the only thing that renders - so back,
   forward and a reloaded tab all land in the same place. The transient screens (a
   running job, a series scan) deliberately have none: back from those means the
   project they belong to, which is where the hash still points. */
const ROUTES = {
  home:    ()  => home(),
  new:     (a) => newProject(a[0] || ""),
  project: (a) => project(a[0]),
  fossa:   (a) => fossa(a[0], a[1]),
  viewseg: (a) => viewseg(a[0], a[1], a[2]),
};
function nav(v, ...args) {
  const h = "#" + [v].concat(args.map(encodeURIComponent)).join("/");
  if (location.hash === h) route();      /* same screen: re-render, no history entry */
  else location.hash = h;                /* otherwise hashchange does the rendering */
}
function route() {
  const parts = location.hash.replace(/^#/, "").split("/")
                  .filter(Boolean).map(decodeURIComponent);
  const v = parts.shift() || "home";
  /* The viewer needs a wider column than anything else. Toggled here rather than in
     the page function, so no other page has to remember to put it back. */
  document.body.classList.toggle("wide", v === "viewseg");
  (ROUTES[v] || ROUTES.home)(parts);
}
window.addEventListener("hashchange", route);

/* ---------------------------------------------------------------- home */
async function home() {
  stopPoll(); crumb.textContent = "";
  view.innerHTML = "";
  view.append($(`<div>
    <h1>Your projects</h1>
    <div class="row" style="margin-bottom:22px">
      <button id="new">New project</button>
    </div>
    <div id="list"></div></div>`));
  /* Straight into the folder chooser - a screen whose only content is another button
     is a screen nobody needs. Only what comes back gets its own screen. */
  document.getElementById("new").onclick = async (ev) => {
    const undo = pending(ev.currentTarget, "Choose a folder…");
    try {
      const r = await api("/api/pick", {});
      undo();
      if (r.unavailable) return nav("new");     /* no dialog here: browse instead */
      if (r.path) nav("new", r.path);           /* cancelled: stay where we are */
    } catch (e) { undo(); nav("new"); }
  };
  const list = document.getElementById("list");
  list.append($(`<div class="meta"><span class="spin dark"></span>loading…</div>`));
  try {
    const {projects} = await api("/api/projects");
    list.innerHTML = "";
    if (!projects.length) {
      list.append($(`<div class="empty">No projects yet.<br>
        Choose <b>New project</b> and point it at a folder of DICOM scans.</div>`));
      return;
    }
    for (const p of projects) {
      const c = $(`<div class="card click">
        <h3>${esc(p.name)}</h3>
        ${p.description ? `<div style="font-size:16px;margin:2px 0 6px">${
          esc(p.description)}</div>` : ""}
        <div class="meta">${p.cases} case${p.cases===1?"":"s"} &middot;
          ${esc(p.source)} &middot; created ${esc(p.created||"")}</div></div>`);
      c.onclick = () => nav("project", p.name);
      list.append(c);
    }
  } catch (e) { list.innerHTML = ""; list.append(err(e)); }
}
function err(e) {
  return $(`<div class="note warn">${esc(e.message || e)}</div>`);
}

/* ------------------------------------------------------- new project */
async function newProject(preset) {
  stopPoll(); crumb.textContent = "New project";
  view.innerHTML = "";
  view.append($(`<div>
    <h1>${preset ? "Cases found" : "Point at your scans"}</h1>
    <div class="row" style="margin-bottom:8px">
      <button ${preset ? 'class="ghost"' : ''} id="pick">
        ${preset ? "Change folder…" : "Choose folder…"}</button>
    </div>
    <div id="pickerr"></div>
    <div id="found"></div></div>`));
  let cur = null;
  const found = document.getElementById("found");

  async function detect(btn) {
    const done = pending(btn, "Looking for cases…");
    found.innerHTML = "";
    try {
      const d = await api("/api/detect?path=" + encodeURIComponent(cur));
      done();
      if (d.error) { found.append(err({message:d.error})); return; }
      if (!d.cases.length) {
        found.append($(`<div class="note warn">No DICOM files found under
          ${esc(cur)}. Open a subfolder and try again.</div>`)); return;
      }
      const box = $(`<div><h2>${d.cases.length} case${d.cases.length===1?"":"s"} found</h2>
        <div id="zipwarn"></div>
        <div class="card" id="cl" style="max-height:290px;overflow:auto"></div>
        <div class="row" style="margin-top:14px">
          <input type="text" id="pname" placeholder="Project name"
                 style="max-width:280px" value="${esc(cur.split(/[\\\\/]/).pop())}">
          <input type="text" id="pdesc" placeholder="What is this? (optional)"
                 style="max-width:340px">
          <button id="create">Create project</button></div>
        <div id="cerr"></div></div>`);
      found.append(box);
      if (d.zips && d.zips.length) {
        document.getElementById("zipwarn").append($(`<div class="note amber">
          This folder still has ${d.zips.length} zip file(s) in it. The pipeline
          <b>unzips and then deletes</b> zip files it finds. Unzip them yourself first
          if you want to keep the originals.</div>`));
      }
      const cl = document.getElementById("cl");
      for (const c of d.cases) {
        const r = $(`<label class="row" style="padding:4px 0">
          <input type="checkbox" checked data-case='${esc(JSON.stringify(c))}'>
          <span>${esc(c.case)}</span>
          ${c.note ? `<span class="pill amber">${esc(c.note)}</span>` : ""}
          </label>`);
        cl.append(r);
      }
      document.getElementById("create").onclick = async (ev) => {
        const b = ev.currentTarget, undo = pending(b, "Creating…");
        const cases = [...cl.querySelectorAll("input:checked")]
          .map(i => JSON.parse(i.dataset.case));
        const cerr = document.getElementById("cerr"); cerr.innerHTML = "";
        try {
          const res = await api("/api/project/create", {
            name: document.getElementById("pname").value, source: cur, cases,
            description: document.getElementById("pdesc").value});
          if (res.failed && res.failed.length)
            alert("Some cases could not be linked:\n" + res.failed.join("\n"));
          nav("project", res.name);
        } catch (e) { undo(); cerr.append(err(e)); }
      };
    } catch (e) { done(); found.append(err(e)); }
  }
  /* The real OS folder chooser, opened by the server on this same machine. If Tk is
     missing there is no in-page browser to fall back to any more, so ask for the path. */
  const pickerr = document.getElementById("pickerr");
  document.getElementById("pick").onclick = async (ev) => {
    const undo = pending(ev.currentTarget, "Choose a folder…");
    pickerr.innerHTML = "";
    try {
      const r = await api("/api/pick", {start: cur || ""});
      undo();
      if (r.unavailable) return typePath(r.unavailable);
      if (!r.path) return;                       /* cancelled - say nothing */
      nav("new", r.path);
    } catch (e) { undo(); pickerr.append(err(e)); }
  };

  function typePath(why) {
    pickerr.innerHTML = "";
    const box = $(`<div class="note amber">No folder dialog on this computer
      (${esc(why)}). Paste the full path instead.
      <div class="row" style="margin-top:8px">
        <input type="text" id="ppath" placeholder="C:\scans  or  /Users/you/scans"
               style="max-width:420px">
        <button id="usepath">Use it</button></div></div>`);
    pickerr.append(box);
    box.querySelector("#usepath").onclick = () => {
      const v = box.querySelector("#ppath").value.trim();
      if (v) nav("new", v);
    };
  }

  if (preset) {
    cur = preset;
    pickerr.append($(`<div class="note"><span class="mono">${esc(cur)}</span></div>`));
    detect(document.getElementById("pick"));
  }
}

/* ---------------------------------------------------------- project */
let TASKS = null;
async function project(name) {
  stopPoll(); crumb.textContent = name;
  view.innerHTML = "";
  view.append($(`<div class="meta"><span class="spin dark"></span>loading…</div>`));
  let st, t;
  try {
    st = await api("/api/project?name=" + encodeURIComponent(name));
    t = TASKS || (TASKS = await api("/api/tasks"));
  } catch (e) { view.innerHTML = ""; view.append(err(e)); return; }

  view.innerHTML = "";
  const offline = st.case_status.filter(c => !c.online);
  view.append($(`<div>
    <h1>${esc(name)}</h1>
    <div id="desc" style="margin:0 0 4px"></div>
    <p class="sub">${st.case_status.length} case(s) &middot;
      <span class="mono">${esc(st.source || "")}</span></p>
    ${offline.length ? `<div class="note warn">${offline.length} case(s) point at a
      folder that is not there right now - is the drive connected?</div>` : ""}
    <div id="cases"></div>
    <h2>Segment</h2>
    <div class="row" style="margin-bottom:10px">
      <input type="search" id="q" placeholder="Search 40 structures…" style="max-width:320px">
      <label class="ui meta"><input type="checkbox" id="force"> re-run even if done</label>
    </div>
    <div class="tasklist" id="tl"></div>
    <div id="lic"></div>
    <h2>Analyses</h2>
    <div class="tasklist" id="al"></div>
    <div class="row" style="margin-top:18px">
      <button id="run">Start segmenting</button>
      <button class="ghost" id="scan">Check series first</button>
    </div>
    <div id="runerr"></div>
    <h2>Results</h2>
    <div id="results"></div>
    </div>`));

  /* Click the description to edit it; Enter or blur saves, Escape puts it back. No
     separate edit button, and no save button to forget to press. */
  const dbox = document.getElementById("desc");
  let dtext = st.description || "";
  function showDesc() {
    dbox.innerHTML = "";
    const d = $(`<div class="editable" tabindex="0" title="Click to edit"
      style="${dtext ? "" : "color:var(--faint)"}"
      >${esc(dtext || "Add a description")}</div>`);
    d.onclick = editDesc;
    // Reachable by keyboard too, for the same reason it is reachable by mouse.
    d.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ")
                             { e.preventDefault(); editDesc(); } };
    dbox.append(d);
  }
  function editDesc() {
    dbox.innerHTML = "";
    const i = $(`<input type="text" style="max-width:520px"
      placeholder="What is this project about?">`);
    i.value = dtext;
    let closed = false;
    const save = async (keep) => {
      if (closed) return; closed = true;
      if (!keep) return showDesc();
      const v = i.value.trim();
      if (v === dtext) return showDesc();
      dtext = v; showDesc();
      try { await api("/api/project/describe", {project: name, description: v}); }
      catch (e) { dbox.append(err(e)); }
    };
    i.onkeydown = (e) => { if (e.key === "Enter") save(true);
                           else if (e.key === "Escape") save(false); };
    i.onblur = () => save(true);
    dbox.append(i); i.focus(); i.select();
  }
  showDesc();

  const doneTasks = new Set();
  st.case_status.forEach(c => c.tasks.forEach(x => doneTasks.add(x)));

  const cases = document.getElementById("cases");
  const tbl = $(`<table><thead><tr>
    <th style="width:26px"><input type="checkbox" id="ckall" checked
      title="select or clear every case"></th><th>Case</th>
    <th>Converted</th><th>Segmented</th><th>Analyses</th><th></th></tr></thead>
    <tbody></tbody></table>`);
  for (const c of st.case_status) {
    const tr = $(`<tr id="row-${esc(c.case)}">
      <td><input type="checkbox" class="ck" checked value="${esc(c.case)}"></td>
      <td><b>${esc(c.case)}</b><div class="meta status"></div></td>
      <td>${c.converted ? '<span class="pill on">yes</span>' : '<span class="pill">no</span>'}</td>
      <td>${c.tasks.length ? c.tasks.map(x=>`<span class="pill on">${esc(x)}</span>`).join("")
                           : '<span class="pill">none</span>'}</td>
      <td>${c.fossae ? '<span class="pill on">fossae</span>' : ''}
          ${c.brain_icv ? '<span class="pill on">brain/ICV</span>' : ''}
          ${c.traced ? '<span class="pill amber">hand-corrected</span>' : ''}</td>
      <td class="row" style="gap:2px">
        ${c.converted ? '<button class="quiet vsg">view segmentation</button>' : ''}
        ${c.fossae ? '<button class="quiet rev">review fossa</button>' : ''}
        ${c.tasks.length || c.fossae || c.brain_icv
          ? '<button class="quiet sif" title="open this case\'s output folder">show in folder</button>' : ''}
      </td>
    </tr>`);
    const vsg = tr.querySelector(".vsg");
    if (vsg) vsg.onclick = () => nav("viewseg", name, c.case);
    const rev = tr.querySelector(".rev");
    if (rev) rev.onclick = () => nav("fossa", name, c.case);
    const sif = tr.querySelector(".sif");
    if (sif) sif.onclick = (ev) => reveal(name, c.case, "", null, ev.currentTarget);
    tbl.querySelector("tbody").append(tr);
  }
  cases.append(tbl);

  /* Header checkbox drives the column, and follows it back: clearing one row should
     leave the header showing "some", not a lie in either direction. */
  const ckall = document.getElementById("ckall");
  const cks = [...tbl.querySelectorAll(".ck")];
  ckall.onchange = () => cks.forEach(c => { c.checked = ckall.checked; });
  cks.forEach(c => c.addEventListener("change", () => {
    const n = cks.filter(x => x.checked).length;
    ckall.checked = n === cks.length;
    ckall.indeterminate = n > 0 && n < cks.length;
  }));

  const tl = document.getElementById("tl");
  const draw = (filter) => {
    tl.innerHTML = "";
    const f = (filter || "").toLowerCase();
    for (const task of t.tasks) {
      if (f && !task.name.toLowerCase().includes(f) &&
          !(task.blurb || "").toLowerCase().includes(f)) continue;
      tl.append($(`<label>
        <input type="checkbox" class="task" value="${esc(task.name)}">
        <span><span class="tname">${esc(task.name)}</span>
          ${task.licensed ? '<span class="pill amber">license</span>' : ''}
          ${doneTasks.has(task.name) ? '<span class="pill on">done</span>' : ''}
          <div class="tblurb">${esc(task.blurb || "")}</div></span></label>`));
    }
    tl.querySelectorAll(".task").forEach(b => b.onchange = licCheck);
  };
  draw("");
  document.getElementById("q").oninput = (e) => draw(e.target.value);

  const al = document.getElementById("al");
  for (const [k, a] of Object.entries(t.analyses)) {
    al.append($(`<label><input type="checkbox" class="anal" value="${esc(k)}">
      <span><span class="tname">${esc(a.label)}</span>
      <div class="tblurb">${esc(a.blurb)} &middot; needs ${esc(a.needs.join(", "))}</div>
      </span></label>`));
  }

  function licCheck() {
    const need = [...document.querySelectorAll(".task:checked")]
      .map(i => i.value).filter(v => t.tasks.find(x => x.name === v && x.licensed));
    const box = document.getElementById("lic");
    box.innerHTML = "";
    if (!need.length) return;
    /* TotalSegmentator stores a license once and reuses it, so when one is already
       registered on this machine there is nothing to ask for. */
    if (t.license_stored) {
      box.append($(`<div class="note">
        <b>${esc(need.join(", "))}</b> need a license &mdash; one is already registered
        on this computer, so they will just run.</div>`));
      return;
    }
    box.append($(`<div class="note amber">
      <b>${esc(need.join(", "))}</b> need a free non-commercial license number.
      <input type="text" id="licno" placeholder="license number"
             style="max-width:260px;margin-top:8px"></div>`));
  }

  document.getElementById("scan").onclick = async (ev) => {
    const undo = pending(ev.currentTarget, "Queued…");
    try {
      const cs = [...document.querySelectorAll(".ck:checked")].map(i => i.value);
      const {job} = await api("/api/scan", {project:name, cases:cs});
      series(name, job, null, cs);
    } catch (e) { undo(); document.getElementById("runerr").append(err(e)); }
  };

  document.getElementById("run").onclick = async (ev) => {
    const btn = ev.currentTarget, undo = pending(btn, "Checking series…");
    const box = document.getElementById("runerr"); box.innerHTML = "";
    const cs = [...document.querySelectorAll(".ck:checked")].map(i => i.value);
    const tasks = [...document.querySelectorAll(".task:checked")].map(i => i.value);
    const anal = [...document.querySelectorAll(".anal:checked")].map(i => i.value);
    if (!cs.length) { undo(); box.append(err({message:"Tick at least one case."})); return; }
    if (!tasks.length && !anal.length) {
      undo(); box.append(err({message:"Tick at least one structure or analysis."})); return; }
    const plan = {project:name, cases:cs, tasks, analyses:anal,
      force: document.getElementById("force").checked,
      license: (document.getElementById("licno")||{}).value || ""};
    try {
      /* Resolve the series before anything is queued. The pipeline asks on the command
         line when it cannot decide, and the GUI runs it with stdin closed, so an
         unresolved case would be skipped silently and look like a run that worked.
         The scan screen goes up immediately and fills in case by case, then either
         continues on its own or waits, depending on what it found. */
      const {job} = await api("/api/scan", {project:name, cases:cs});
      undo();
      return series(name, job, plan, cs);
    } catch (e) { undo(); box.append(err(e)); }
  };

  const res = document.getElementById("results");
  const kinds = [["produce_table","All structure volumes",`${name}_table.csv`],
                 ["brain_icv","Brain and ICV","brain_icv_volumes.csv"],
                 ["fossae","Cranial fossa volumes","fossa_volumes.csv"]];
  for (const [kind, label, file] of kinds) {
    const c = $(`<div class="card"><div class="row">
      <div><h3>${esc(label)}</h3><div class="meta mono">${esc(file)}</div></div>
      <span class="right"></span>
      <button class="ghost bld">Build</button>
      <button class="ghost dl">Download</button>
      <button class="quiet sif" title="open it in Explorer/Finder">show in folder</button>
      </div><div class="out"></div></div>`);
    c.querySelector(".sif").onclick = (ev) =>
      reveal(name, "", file, c.querySelector(".out"), ev.currentTarget);
    c.querySelector(".bld").onclick = async (ev) => {
      const undo = pending(ev.currentTarget, "Building…");
      const out = c.querySelector(".out"); out.innerHTML = "";
      try {
        const {job} = await api("/api/table", {project:name, kind});
        await follow(job, (s) => {
          out.innerHTML = "";
          out.append($(`<div class="meta">${esc(s.state)}${
            s.state==="running" ? " · " + fmtTime(s.elapsed) : ""}</div>`));
          if (s.state === "failed")
            out.append($(`<div class="note warn">${esc(
              (s.lines||[]).slice(-3).join("\n") || s.error)}</div>`));
        });
      } catch (e) { out.append(err(e)); } finally { undo(); }
    };
    c.querySelector(".dl").onclick = () => {
      window.location = "/api/download?name=" + encodeURIComponent(name) +
        "&file=" + encodeURIComponent(file) + "&token=" + encodeURIComponent(TOKEN);
    };
    res.append(c);
  }
}

/* Ask the server to open Explorer/Finder on something it produced. The dialog and the
   window both appear on this machine, which is the whole reason a local server can do
   what a web page cannot. */
async function reveal(project, cse, file, out, btn) {
  const undo = pending(btn, "Opening…");
  if (out) out.innerHTML = "";
  try { await api("/api/reveal", {project, case: cse, file}); }
  catch (e) { if (out) out.append(err(e)); else alert(e.message || e); }
  finally { undo(); }
}

/* ------------------------------------------------------- job following */
async function follow(id, onTick) {
  let since = 0;
  return new Promise((resolve) => {
    stopPoll();
    POLL = setInterval(async () => {
      let s;
      try { s = await api("/api/job?id=" + id + "&since=" + since); }
      catch { return; }
      since = s.next;
      onTick(s);
      if (["done","failed","cancelled"].includes(s.state)) { stopPoll(); resolve(s); }
    }, 800);
  });
}

function running(name, jobs) {
  stopPoll(); crumb.textContent = name + " · running";
  view.innerHTML = "";
  view.append($(`<div>
    <h1>Working</h1>
    <p class="sub" id="head">Starting…</p>
    <div class="bar"><i id="bar" style="width:0%"></i></div>
    <div class="row" style="margin-bottom:14px">
      <button class="ghost" id="cancel">Stop</button>
      <button class="quiet" id="back">Back to project</button>
      <span class="right meta" id="clock"></span></div>
    <div id="log"></div></div>`));
  const log = document.getElementById("log");
  document.getElementById("back").onclick = () => nav("project", name);
  let cur = 0;
  document.getElementById("cancel").onclick = async (ev) => {
    const undo = pending(ev.currentTarget, "Stopping…");
    try { await api("/api/job/cancel", {id: jobs[cur]}); } catch {}
    undo();
  };
  /* a ticking clock is what separates "working" from "frozen" when TotalSegmentator
     goes quiet for minutes at a time */
  let t0 = Date.now();
  setInterval(() => {
    const el = document.getElementById("clock");
    if (el && el.dataset.live === "1")
      el.textContent = fmtTime((Date.now() - t0) / 1000);
  }, 1000);

  (async () => {
    for (let i = 0; i < jobs.length; i++) {
      cur = i; t0 = Date.now();
      const clock = document.getElementById("clock");
      if (clock) clock.dataset.live = "1";
      await follow(jobs[i], (s) => {
        const q = s.state === "queued";
        document.getElementById("head").innerHTML = q
          ? `<span class="spin dark"></span>Queued &mdash; waiting for another job to finish`
          : `${esc(s.label)} &mdash; step ${s.step} of ${s.steps}` +
            (s.step_label ? ` &middot; <b>${esc(s.step_label)}</b>` : "");
        document.getElementById("bar").style.width =
          (s.steps ? 100 * s.step / s.steps : 0) + "%";
        for (const line of s.lines || []) {
          const cls = line.startsWith("$ ") ? "cmd"
                    : /error|fail|traceback|!!/i.test(line) ? "bad" : "";
          log.append($(`<div class="${cls}">${esc(line)}</div>`));
        }
        if (s.lines && s.lines.length) log.scrollTop = log.scrollHeight;
      });
      const clock2 = document.getElementById("clock");
      if (clock2) clock2.dataset.live = "0";
    }
    document.getElementById("head").textContent = "Finished.";
    document.getElementById("bar").style.width = "100%";
    const b = $(`<button style="margin-top:14px">See results</button>`);
    b.onclick = () => nav("project", name);
    document.getElementById("log").after(b);
  })();
}

/* ------------------------------------------------------ series screen */
/* `plan` is set when we got here on the way to segmenting: the run is held until every
   case has a series, then continues by itself. `need` names the cases that blocked it. */
async function series(name, job, plan, cases) {
  stopPoll(); crumb.textContent = name + " · series";
  view.innerHTML = "";
  view.append($(`<div>
    <h1>${plan ? "Checking the scans" : "Which series?"}</h1>
    <div id="snote"></div>
    <div id="cs"></div>
    <div class="row" style="margin-top:16px">
      ${plan ? '<button id="go" disabled>Reading…</button>' : ""}
      <button class="${plan ? "quiet" : ""}" id="doneb">Back to project</button>
      </div></div>`));
  document.getElementById("doneb").onclick = () => nav("project", name);
  const snote = document.getElementById("snote");
  const cs = document.getElementById("cs");

  /* A placeholder per case up front, so a scan that takes a minute a case shows a list
     filling in rather than an empty screen. */
  const slots = {};
  for (const c of (cases || [])) {
    slots[c] = $(`<div class="card"><div class="row"><h3>${esc(c)}</h3>
      <span class="meta"><span class="spin dark"></span>reading…</span></div></div>`);
    cs.append(slots[c]);
  }
  if (!cases || !cases.length)
    cs.append($(`<div class="meta"><span class="spin dark"></span>reading the scans…</div>`));

  const unresolved = new Set();
  function retest() {
    const go = document.getElementById("go");
    if (!go) return;
    go.disabled = unresolved.size > 0;
    go.textContent = unresolved.size
      ? `${unresolved.size} case(s) still need a series`
      : "Start segmenting";
  }
  /* What the scan chose by itself, per case, so going ahead can record those choices
     and the screen genuinely does not come back for the same cases. */
  const autoPick = {};
  async function launch(btn) {
    const undo = pending(btn, "Starting…");
    try {
      for (const [cse, chosen] of Object.entries(autoPick))
        await api("/api/series/pick", {project:name, case:cse,
          series_dir:chosen.series_dir, snum:chosen.snum, desc:chosen.desc});
      const r = await api("/api/run", plan);
      running(name, r.jobs);
    } catch (e) { if (undo) undo(); cs.append(err(e)); }
  }
  const go = document.getElementById("go");
  if (go) go.onclick = (ev) => launch(ev.currentTarget);

  let last = {};
  await follow(job, (s) => {
    if (!s.results) return;
    last = s.results;
    for (const [cse, r] of Object.entries(s.results)) {
      if (slots[cse] && slots[cse].dataset.done === "1") continue;
      const card = render(cse, r);
      if (slots[cse]) { slots[cse].replaceWith(card); slots[cse] = card; }
      else cs.append(card);
      card.dataset.done = "1";
    }
    retest();
  });

  if (!plan) return;

  /* The scan is finished: decide whether this screen still has a job to do. Cases with
     a recorded choice need no confirmation, so an all-cached run carries straight on -
     the screen was the progress display. Anything else waits for a look. */
  const blocking = Object.entries(last)
    .filter(([, r]) => r.error || r.decision === "manual" || r.decision === "none")
    .map(([c]) => c);
  const unseen = Object.entries(last)
    .filter(([, r]) => !r.error && r.decision === "auto").map(([c]) => c);
  blocking.forEach(c => unresolved.add(c));
  retest();

  if (!blocking.length && !unseen.length) {
    snote.append($(`<div class="note">Every case already had a series chosen. Starting
      the segmentation…</div>`));
    return launch(document.getElementById("go"));
  }
  document.querySelector("h1").textContent = "Which series?";
  snote.append($(blocking.length
    ? `<div class="note amber">Segmenting is on hold: <b>${esc(blocking.join(", "))}</b>
       ${blocking.length === 1 ? "has" : "have"} more than one equally plausible series,
       so the choice is yours.</div>`
    : `<div class="note">First time segmenting <b>${esc(unseen.join(", "))}</b>. These
       were picked automatically — change any of them, or go ahead. You will not be
       asked again.</div>`));

  function render(cse, r) {
    if (r.error) {
      return $(`<div class="card"><h3>${esc(cse)}</h3>
        <div class="note warn">${esc(r.error)}</div></div>`);
    }
    const badge = {cached:'<span class="pill on">already chosen</span>',
                   auto:'<span class="pill on">picked automatically</span>',
                   manual:'<span class="pill amber">needs you to choose</span>',
                   none:'<span class="pill warn">no series found</span>'}[r.decision];
    const card = $(`<div class="card"><div class="row">
      <h3>${esc(cse)}</h3>${badge}</div>
      <table><thead><tr><th></th><th>Series</th><th>Slices</th><th>Thickness</th>
        <th>Kernel</th><th>Plane</th><th>Score</th><th>Description</th></tr></thead>
      <tbody></tbody></table></div>`);
    if (plan && r.chosen && r.decision !== "cached") autoPick[cse] = r.chosen;
    const tb = card.querySelector("tbody");
    for (const s of r.series) {
      const chosen = r.chosen && String(r.chosen.snum) === String(s.snum);
      const tr = $(`<tr class="${chosen ? "sel" : ""}">
        <td><button class="quiet pick">use</button></td>
        <td>${esc(s.snum)}</td><td>${s.slices}</td>
        <td>${s.thickness == null ? "?" : esc(s.thickness) + "mm"}</td>
        <td class="mono">${esc(s.kernel || "?")}</td>
        <td>${s.axial ? "axial" : "other"}</td>
        <td><b>${s.score}</b></td>
        <td>${esc(s.desc || "(none)")}
          <div class="reasons">${esc((s.reasons||[]).join(", "))}</div></td></tr>`);
      tr.querySelector(".pick").onclick = async (ev) => {
        const undo = pending(ev.currentTarget, "Saving…");
        try {
          const res = await api("/api/series/pick", {project:name, case:cse,
            series_dir:s.series_dir, snum:s.snum, desc:s.desc});
          tb.querySelectorAll("tr").forEach(x => x.classList.remove("sel"));
          tr.classList.add("sel");
          card.querySelector(".pill").outerHTML =
            '<span class="pill on">chosen by you</span>';
          delete autoPick[cse];          /* the user's pick is already written */
          unresolved.delete(cse); retest();
          if (res.cleared_nifti)
            card.append($(`<div class="note amber">Removed the old converted image so
              this new choice takes effect.</div>`));
        } catch (e) { card.append(err(e)); } finally { undo(); }
      };
      tb.append(tr);
    }
    return card;
  }
}

/* -------------------------------------------------------- fossa review */
async function fossa(name, cse) {
  stopPoll(); crumb.textContent = name + " · " + cse;
  view.innerHTML = "";
  view.append($(`<div>
    <h1>Fossa boundaries</h1>
    <p class="sub">${esc(cse)} &mdash; skull floor from above. Light is high, dark is
    deep. Click left to right to draw a boundary.</p>
    <div class="row" style="margin-bottom:10px">
      <button class="ghost" id="mAnt">Trace anterior</button>
      <button class="ghost" id="mPost">Trace posterior</button>
      <button class="quiet" id="undo">Undo point</button>
      <button class="quiet" id="clear">Clear</button></div>
    <canvas id="cv" width="560" height="560"></canvas>
    <div class="meta" style="margin:8px 0 16px">magenta = anterior, cyan = posterior
      &middot; dashed is what the pipeline chose &middot; anterior is up, x is the
      patient's right</div>
    <div id="vols"></div>
    <fieldset style="border:1px solid var(--line);border-radius:8px;margin:0 0 16px;
                     padding:10px 14px;background:var(--surface)">
      <legend class="meta">Extrusion axis</legend>
      <div class="meta" id="axis" style="margin-bottom:6px"></div>
      <div class="row">
        <label class="ui meta">pitch
          <input type="number" id="pitch" value="0" step="1"
                 style="width:74px;margin-left:6px"></label>
        <label class="ui meta">roll
          <input type="number" id="roll" value="0" step="1"
                 style="width:74px;margin-left:6px"></label>
        <span class="meta">degrees</span>
      </div>
      <div class="meta" style="margin-top:6px">Pitch tips the walls front to back, roll
        side to side, in the head’s own frame. Changing either re-measures the floor
        map, so any boundary you traced is re-read against the new surface.</div>
    </fieldset>
    <div class="row"><button id="apply">Apply and recompute</button>
      <button class="ghost" id="drop">Drop corrections</button>
      <button class="ghost" id="see">View in 2D/3D</button>
      <button class="quiet" id="back">Back</button></div>
    <div id="fout"></div>
    <h2>Result</h2>
    <div class="meta" style="margin-bottom:8px">The floor map with the fitted
      boundaries, and the sagittal slice as 3D Slicer would show it. This is what the
      pitch and roll above change — check the walls against the bone here.</div>
    <img id="result" style="max-width:100%;border:1px solid var(--line);
      border-radius:8px;background:var(--surface)">
    <div id="rout"></div>
    </div>`));
  document.getElementById("back").onclick = () => nav("project", name);
  document.getElementById("see").onclick =
    () => nav("viewseg", name, cse, "fossae_simple");

  const cv = document.getElementById("cv"), cx = cv.getContext("2d");
  let ST = null, mode = "post", pts = {ant:[], post:[]};
  const img = new Image();

  try { ST = await api("/api/fossa/case?name=" + encodeURIComponent(name) +
                       "&case=" + encodeURIComponent(cse)); }
  catch (e) { view.append(err(e)); return; }
  for (const k of ["ant","post"]) if (ST.edits[k]) pts[k] = ST.edits[k];
  if (ST.edits.up_adjust) {
    document.getElementById("pitch").value = ST.edits.up_adjust[0];
    document.getElementById("roll").value = ST.edits.up_adjust[1];
  }
  function axisLine() {
    document.getElementById("axis").textContent = ST.stats.up_axis
      ? `${ST.stats.up_axis} — ${ST.stats.up_tilt_vs_scanner_deg}` +
        "° off the scanner vertical" : "";
  }
  axisLine();
  vols();

  const result = document.getElementById("result");
  function showResult() {
    result.style.display = "";
    document.getElementById("rout").innerHTML = "";
    result.src = "/api/fossa/map.png?name=" + encodeURIComponent(name) +
                 "&case=" + encodeURIComponent(cse) +
                 "&token=" + encodeURIComponent(TOKEN) + "&t=" + Date.now();
  }
  result.onerror = () => {
    result.style.display = "none";
    document.getElementById("rout").append($(`<div class="note">No result picture for
      this case yet — apply a correction, or re-run the fossa analysis, to draw
      one.</div>`));
  };
  showResult();

  img.onload = draw;
  img.src = "/api/fossa/floor.png?name=" + encodeURIComponent(name) +
            "&case=" + encodeURIComponent(cse) + "&token=" + encodeURIComponent(TOKEN) +
            "&t=" + Date.now();

  const mm2x = (m) => (m - ST.lanes[0]) / (ST.lanes.at(-1) - ST.lanes[0]) * cv.width;
  const mm2y = (m) => (ST.fmax - m) / (ST.fmax - ST.f0) * cv.height;
  const x2mm = (x) => ST.lanes[0] + x / cv.width * (ST.lanes.at(-1) - ST.lanes[0]);
  const y2mm = (y) => ST.fmax - y / cv.height * (ST.fmax - ST.f0);

  function poly(v, color, dash) {
    cx.beginPath(); cx.strokeStyle = color; cx.lineWidth = 2;
    cx.setLineDash(dash ? [6,4] : []);
    ST.lanes.forEach((l,i) => { const x = mm2x(l), y = mm2y(v[i]);
      i ? cx.lineTo(x,y) : cx.moveTo(x,y); });
    cx.stroke(); cx.setLineDash([]);
  }
  function draw() {
    cx.clearRect(0,0,cv.width,cv.height);
    cx.drawImage(img, 0, 0, cv.width, cv.height);
    poly(ST.ant, "magenta", true); poly(ST.post, "cyan", true);
    for (const [k,color] of [["ant","magenta"],["post","cyan"]]) {
      if (!pts[k].length) continue;
      cx.beginPath(); cx.strokeStyle = color; cx.lineWidth = 3;
      pts[k].forEach((p,i) => { const x = mm2x(p[0]), y = mm2y(p[1]);
        i ? cx.lineTo(x,y) : cx.moveTo(x,y); });
      cx.stroke(); cx.fillStyle = color;
      pts[k].forEach(p => { cx.beginPath();
        cx.arc(mm2x(p[0]), mm2y(p[1]), 4, 0, 7); cx.fill(); });
    }
  }
  cv.onclick = (e) => {
    const r = cv.getBoundingClientRect();
    const sx = cv.width / r.width, sy = cv.height / r.height;
    pts[mode].push([x2mm((e.clientX-r.left)*sx), y2mm((e.clientY-r.top)*sy)]);
    pts[mode].sort((a,b) => a[0]-b[0]); draw();
  };
  const setMode = (m) => { mode = m;
    document.getElementById("mAnt").style.fontWeight = m==="ant" ? "700" : "";
    document.getElementById("mPost").style.fontWeight = m==="post" ? "700" : ""; };
  document.getElementById("mAnt").onclick = () => setMode("ant");
  document.getElementById("mPost").onclick = () => setMode("post");
  document.getElementById("undo").onclick = () => { pts[mode].pop(); draw(); };
  document.getElementById("clear").onclick = () => { pts[mode] = []; draw(); };
  setMode("post");

  function vols() {
    const c = (ST.stats || {}).compartments || {};
    const box = document.getElementById("vols"); box.innerHTML = "";
    if (!Object.keys(c).length) return;
    box.append($(`<div class="card"><div class="row">` +
      Object.entries(c).map(([k,v]) =>
        `<div style="margin-right:26px"><h3>${esc(k.replace("_"," "))}</h3>
         <div class="meta">${v.ml} mL &middot; ${v.percent_of_icv}% of ICV</div></div>`
      ).join("") + `</div></div>`));
  }

  async function send(edits, btn, label) {
    const undo = pending(btn, label);
    const out = document.getElementById("fout"); out.innerHTML = "";
    try {
      const {job} = await api("/api/fossa/apply", {project:name, case:cse, edits});
      await follow(job, (s) => {
        out.innerHTML = "";
        out.append($(`<div class="meta">${esc(s.state)}${
          s.state === "running" ? " · " + fmtTime(s.elapsed) : ""} ${
          esc(s.step_label||"")}</div>`));
      });
      ST = await api("/api/fossa/case?name=" + encodeURIComponent(name) +
                     "&case=" + encodeURIComponent(cse));
      vols(); axisLine();
      img.src = "/api/fossa/floor.png?name=" + encodeURIComponent(name) +
                "&case=" + encodeURIComponent(cse) +
                "&token=" + encodeURIComponent(TOKEN) + "&t=" + Date.now();
      showResult();
      out.append($(`<div class="note">Recomputed.</div>`));
    } catch (e) { out.append(err(e)); } finally { undo(); }
  }
  function axisEdit() {
    const p = parseFloat(document.getElementById("pitch").value) || 0;
    const r = parseFloat(document.getElementById("roll").value) || 0;
    return (p || r) ? [p, r] : null;      /* zero is no adjustment, not an adjustment */
  }
  document.getElementById("apply").onclick = (ev) => {
    const e = {};
    for (const k of ["ant","post"]) if (pts[k].length >= 2) e[k] = pts[k];
    const ax = axisEdit();
    if (ax) e.up_adjust = ax;
    if (!Object.keys(e).length) {
      document.getElementById("fout").append(
        err({message:"Draw at least two points, or set a pitch or roll, first."}));
      return; }
    send(e, ev.currentTarget, "Recomputing…");
  };
  document.getElementById("drop").onclick = (ev) => {
    pts = {ant:[], post:[]};
    document.getElementById("pitch").value = 0;
    document.getElementById("roll").value = 0;
    draw(); send({}, ev.currentTarget, "Refitting…");
  };
}



/* ------------------------------------------------------------- 3d viewer */
/* A small WebGL2 renderer, written out rather than pulled in: the whole tool is one
   self-contained page with no vendored JavaScript, and "spin the structures around"
   needs so little of a 3D library that taking on 700 KB to get it would be the wrong
   trade. Lit triangles, an orbit camera, and back-to-front ordering when things go
   translucent - that is all of it.

   WebGL2 specifically, for uint32 indices: a structure runs to tens of thousands of
   vertices, past what uint16 can address, and splitting meshes to avoid that would be
   more code than requiring a context every browser has had for years. */

const V3_VERT = `#version 300 es
in vec3 aPos;
in vec3 aNrm;
uniform mat4 uMVP;
uniform mat3 uNM;
out vec3 vN;
void main(){ vN = uNM * aNrm; gl_Position = uMVP * vec4(aPos, 1.0); }`;

const V3_FRAG = `#version 300 es
precision highp float;
in vec3 vN;
uniform vec3 uColor;
uniform float uAlpha;
out vec4 o;
void main(){
  /* Headlight down the eye axis. abs() rather than max(...,0) so it does not matter
     which way marching cubes wound the surface, and so back faces are lit properly
     once the opacity comes down and you can see them. */
  float d = abs(normalize(vN).z);
  float f = 0.24 + 0.76 * d + 0.10 * pow(d, 40.0);
  o = vec4(uColor * f, uAlpha);
}`;

/* -- just enough matrix maths, column-major to match WebGL ---------------- */
function m4mul(a, b) {
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    let s = 0;
    for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
    o[c * 4 + r] = s;
  }
  return o;
}
function m4perspective(fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2), o = new Float32Array(16);
  o[0] = f / aspect; o[5] = f; o[11] = -1;
  o[10] = (far + near) / (near - far);
  o[14] = 2 * far * near / (near - far);
  return o;
}
const m4translate = (x, y, z) => {
  const o = new Float32Array(16); o[0] = o[5] = o[10] = o[15] = 1;
  o[12] = x; o[13] = y; o[14] = z; return o;
};
function m4rotX(t) {
  const c = Math.cos(t), s = Math.sin(t), o = new Float32Array(16);
  o[0] = 1; o[5] = c; o[6] = s; o[9] = -s; o[10] = c; o[15] = 1; return o;
}
function m4rotZ(t) {
  const c = Math.cos(t), s = Math.sin(t), o = new Float32Array(16);
  o[0] = c; o[1] = s; o[4] = -s; o[5] = c; o[10] = 1; o[15] = 1; return o;
}

function makeViewer3D(canvas) {
  const gl = canvas.getContext("webgl2", {antialias: true, alpha: false, depth: true});
  if (!gl) return {ok: false};

  const sh = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
      throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  let prog, loc;
  function buildProgram() {
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, V3_VERT));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, V3_FRAG));
    gl.bindAttribLocation(prog, 0, "aPos");
    gl.bindAttribLocation(prog, 1, "aNrm");
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
      throw new Error(gl.getProgramInfoLog(prog));
    loc = {mvp: gl.getUniformLocation(prog, "uMVP"),
           nm: gl.getUniformLocation(prog, "uNM"),
           color: gl.getUniformLocation(prog, "uColor"),
           alpha: gl.getUniformLocation(prog, "uAlpha")};
  }
  buildProgram();

  /* key -> {vao, nidx, color, bmin, bmax, raw}. The decoded ArrayBuffer is kept so a
     lost GL context can be rebuilt without going back to the network. */
  const meshes = new Map();
  let order = [];                     /* draw order, recomputed when the camera moves */
  let alpha = 1, lost = false, need = false;
  const cam = {az: 0, el: 0, dist: 200, target: [0, 0, 0], moved: false};

  function invalidate() {
    if (need || lost) return;
    need = true;
    requestAnimationFrame(() => { need = false; draw(); });
  }

  function upload(m) {
    const nv = m.nv;
    m.vao = gl.createVertexArray();
    gl.bindVertexArray(m.vao);
    const vb = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vb);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(m.raw, 40, nv * 3), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    const nb = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, nb);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(m.raw, 40 + nv * 12, nv * 3),
                  gl.STATIC_DRAW);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
    const ib = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,
                  new Uint32Array(m.raw, 40 + nv * 24, m.nidx), gl.STATIC_DRAW);
    gl.bindVertexArray(null);
    m.bufs = [vb, nb, ib];
  }

  /* Decode the blob the server sent. gzip is undone by the browser before this. */
  function add(key, buf, color) {
    const dv = new DataView(buf);
    if (String.fromCharCode(dv.getUint8(0), dv.getUint8(1), dv.getUint8(2),
                            dv.getUint8(3)) !== "MSH1")
      throw new Error("not a mesh");
    const nv = dv.getUint32(4, true), nt = dv.getUint32(8, true);
    if (!nv || !nt) { meshes.set(key, {empty: true}); return; }
    const m = {raw: buf, nv: nv, nidx: nt * 3, color: hex3(color),
               bmin: [dv.getFloat32(16, true), dv.getFloat32(20, true), dv.getFloat32(24, true)],
               bmax: [dv.getFloat32(28, true), dv.getFloat32(32, true), dv.getFloat32(36, true)]};
    m.centre = [0, 1, 2].map(k => (m.bmin[k] + m.bmax[k]) / 2);
    upload(m);
    meshes.set(key, m);
    if (!cam.moved) fit();
    invalidate();
  }
  const hex3 = (h) => {
    const s = String(h).replace("#", "");
    return [0, 2, 4].map(k => parseInt(s.substr(k, 2), 16) / 255);
  };

  /* Frame everything visible. Skipped once the user has moved the camera, so
     structures arriving one at a time do not keep yanking the view. */
  function fit() {
    const live = [...meshes.values()].filter(m => !m.empty);
    if (!live.length) return;
    const lo = [0, 1, 2].map(k => Math.min(...live.map(m => m.bmin[k])));
    const hi = [0, 1, 2].map(k => Math.max(...live.map(m => m.bmax[k])));
    cam.target = [0, 1, 2].map(k => (lo[k] + hi[k]) / 2);
    const r = Math.max(1, Math.hypot(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]) / 2);
    cam.dist = r / Math.sin(35 * Math.PI / 360) * 1.15;
    cam.radius = r;
  }

  function viewMatrix() {
    /* Rz spins about the patient's superior axis; the -90 degree Rx that follows puts
       superior up the screen and starts the camera in front of the face, which is the
       view anyone expects to open on. */
    return m4mul(m4mul(m4translate(0, 0, -cam.dist),
                       m4mul(m4rotX((cam.el - 90) * Math.PI / 180),
                             m4rotZ(cam.az * Math.PI / 180))),
                 m4translate(-cam.target[0], -cam.target[1], -cam.target[2]));
  }

  function draw() {
    if (lost) return;
    const W = canvas.width, H = canvas.height;
    gl.viewport(0, 0, W, H);
    gl.clearColor(0.043, 0.043, 0.047, 1);
    gl.enable(gl.DEPTH_TEST);
    gl.disable(gl.CULL_FACE);            /* interiors are visible when translucent */
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    const live = [...meshes.entries()].filter(([k, m]) => !m.empty && m.vao);
    if (!live.length) return;

    const view = viewMatrix();
    const mvp = m4mul(m4perspective(35 * Math.PI / 180, W / Math.max(1, H),
                                    Math.max(0.1, cam.dist * 0.02), cam.dist * 10), view);
    const nm = new Float32Array([view[0], view[1], view[2],
                                 view[4], view[5], view[6],
                                 view[8], view[9], view[10]]);
    gl.useProgram(prog);
    gl.uniformMatrix4fv(loc.mvp, false, mvp);
    gl.uniformMatrix3fv(loc.nm, false, nm);

    /* Sort back to front by the eye-space depth of each bounding box centre. Per
       object, not per triangle: for the case that matters - one structure nested
       inside another, brain inside ICV - the object order is exactly right, and a
       136k-element sort per frame to do better is not worth it here. */
    const depth = (m) => view[2] * m.centre[0] + view[6] * m.centre[1]
                       + view[10] * m.centre[2] + view[14];
    order = live.sort((a, b) => depth(a[1]) - depth(b[1]));

    const one = (m) => {
      gl.bindVertexArray(m.vao);
      gl.uniform3fv(loc.color, m.color);
      gl.uniform1f(loc.alpha, alpha);
      gl.drawElements(gl.TRIANGLES, m.nidx, gl.UNSIGNED_INT, 0);
    };
    if (alpha >= 0.99) {
      gl.depthMask(true); gl.disable(gl.BLEND);
      for (const [, m] of order) one(m);
    } else {
      /* Depth test on so solid geometry still occludes, depth write off so the
         surfaces behind are not thrown away before they are drawn. */
      gl.depthMask(false);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      for (const [, m] of order) one(m);
      gl.depthMask(true); gl.disable(gl.BLEND);
    }
    gl.bindVertexArray(null);
  }

  /* -- interaction ------------------------------------------------------- */
  let drag = null;
  canvas.onpointerdown = (e) => {
    drag = {x: e.clientX, y: e.clientY, az: cam.az, el: cam.el,
            t: cam.target.slice(), pan: e.shiftKey || e.button === 1 || e.button === 2};
    /* Capture keeps a drag alive when the cursor leaves the canvas. It throws if the
       pointer has already gone, which must not take the drag down with it. */
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    canvas.classList.add("drag");
  };
  canvas.onpointermove = (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (drag.pan) {
      /* Pan in the camera's own plane, scaled so a pixel of drag moves the model by
         a pixel's worth of millimetres at the distance we are looking from. */
      const k = 2 * cam.dist * Math.tan(35 * Math.PI / 360) / canvas.clientHeight;
      const v = viewMatrix();
      const right = [v[0], v[4], v[8]], up = [v[1], v[5], v[9]];
      cam.target = [0, 1, 2].map(i => drag.t[i] - right[i] * dx * k + up[i] * dy * k);
    } else {
      /* Signs chosen so the model follows the pointer, as if you had hold of the
         surface: drag down and the top tilts towards you. The other way round reads
         as inverted to everyone who has used any other 3D viewer. */
      cam.az = drag.az + dx * 0.5;
      /* Clamped short of the pole: letting it tip over flips the horizon and makes
         "which way is up" a thing you have to think about. */
      cam.el = Math.max(-89, Math.min(89, drag.el + dy * 0.5));
    }
    cam.moved = true;
    invalidate();
  };
  const endDrag = (e) => {
    if (!drag) return;
    drag = null; canvas.classList.remove("drag");
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  };
  canvas.onpointerup = endDrag;
  canvas.onpointercancel = endDrag;
  canvas.oncontextmenu = (e) => e.preventDefault();      /* right-drag pans instead */
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = cam.radius || 100;
    cam.dist = Math.max(r * 0.05, Math.min(r * 40, cam.dist * Math.exp(e.deltaY * 0.0015)));
    cam.moved = true;
    invalidate();
  }, {passive: false});
  canvas.ondblclick = () => { cam.moved = false; cam.az = cam.el = 0; fit(); invalidate(); };

  canvas.addEventListener("webglcontextlost", (e) => {
    e.preventDefault(); lost = true;
    for (const m of meshes.values()) if (!m.empty) { m.vao = null; m.bufs = null; }
  });
  canvas.addEventListener("webglcontextrestored", () => {
    lost = false; buildProgram();
    for (const m of meshes.values()) if (!m.empty) upload(m);
    invalidate();
  });

  function drop(key) {
    const m = meshes.get(key);
    if (m && m.vao) { gl.deleteVertexArray(m.vao); (m.bufs || []).forEach(b => gl.deleteBuffer(b)); }
    meshes.delete(key);
  }

  return {
    ok: true,
    has: (key) => meshes.has(key),
    add: add,
    drop: drop,
    keys: () => [...meshes.keys()],
    triangles: () => [...meshes.values()].reduce((a, m) => a + (m.empty ? 0 : m.nidx / 3), 0),
    setOpacity: (a) => { if (a !== alpha) { alpha = a; invalidate(); } },
    view: (az, el) => { cam.az = az; cam.el = el; cam.moved = true; invalidate(); },
    refit: () => { cam.moved = false; fit(); invalidate(); },
    invalidate: invalidate,
    resize: () => {
      const b = canvas.parentNode.getBoundingClientRect();
      /* Capped at 2: a 3x display costs 2.25 times the fragments for nothing anyone
         can see on an anatomical blob. */
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.max(1, Math.round(b.width)), h = Math.max(1, Math.round(b.height));
      canvas.style.width = w + "px"; canvas.style.height = h + "px";
      const W = Math.round(w * dpr), H = Math.round(h * dpr);
      if (canvas.width !== W || canvas.height !== H) {
        canvas.width = W; canvas.height = H; invalidate();
      }
    },
    dispose: () => {
      for (const k of [...meshes.keys()]) drop(k);
      if (prog) gl.deleteProgram(prog);
      const ext = gl.getExtension("WEBGL_lose_context");
      if (ext) ext.loseContext();
    },
  };
}

/* --------------------------------------------------------------- slice viewer */
/* Scroll a CT, switch structures on and off, without leaving for Slicer. Everything
   drawn is composited by the server and arrives as one PNG, so this side is an <img>,
   a slider and a list - no canvas and no 3D library. Two things make it feel
   immediate: one request in flight at a time with latest-wins coalescing, and
   swapping in an Image() that has already decoded rather than setting src directly. */
async function viewseg(name, cse, focus) {
  stopPoll();
  crumb.textContent = name + " · " + cse;
  view.innerHTML = "";
  view.append($(`<div>
    <div class="row" style="margin-bottom:14px">
      <h1 style="margin:0">Segmentation</h1>
      <span class="right"><button class="ghost" id="back">Back to project</button></span>
    </div>
    <div id="vhead"></div>
    <div class="vwrap hide" id="vwrap">
      <aside class="vside">
        <input type="search" id="vq" placeholder="Search structures">
        <div class="row" style="gap:2px">
          <button class="quiet" id="vall">show all</button>
          <button class="quiet" id="vnone">hide all</button>
        </div>
        <div class="vtree" id="vtree"></div>
      </aside>
      <section>
        <div class="row" style="margin:0 0 10px">
          <span class="row" style="gap:4px" id="vplanes"></span>
          <span class="right row" style="gap:4px" id="vpre"></span>
        </div>
        <div class="vstage" id="vstage" tabindex="0">
          <img id="vimg" alt="">
          <div class="vbusy hide" id="vbusy">loading…</div>
        </div>
        <input type="range" id="vsl" style="width:100%;margin:12px 0 2px"
               min="0" max="0" value="0">
        <div class="row meta">
          <span class="mono" id="vlabel"></span>
          <span class="right row" style="gap:7px">
            <label for="vop">overlay</label>
            <input type="range" id="vop" min="0" max="100" value="45" style="width:110px">
            <span class="mono" id="vopv">45%</span>
          </span>
        </div>
      </section>
    </div></div>`));
  const g = (id) => document.getElementById(id);
  g("back").onclick = () => nav("project", name);

  let st;
  try {
    st = await api("/api/view/case?name=" + encodeURIComponent(name) +
                   "&case=" + encodeURIComponent(cse));
  } catch (e) {
    /* "RuntimeError: this case has not been converted yet" - the sentence after the
       colon was written for whoever is reading it; the class name in front was not. */
    g("vhead").append(err(new Error(String(e.message || e).replace(/^\w*Error: /, ""))));
    return;
  }
  g("vwrap").classList.remove("hide");
  for (const w of st.warnings || []) g("vhead").append($(`<div class="note amber">${esc(w)}</div>`));

  const PL = ["axial", "coronal", "sagittal"];
  const S = {plane: "axial", mode: "2d", idx: {}, op: 45, op3: 100,
             ww: st.presets[st.default][0], wl: st.presets[st.default][1]};
  for (const p of PL) S.idx[p] = Math.floor(st.planes[p].n / 2);

  /* One bitset per task, indexed by the segment index the server sent. The same
     numbering is the DOM id, the colour table row and the URL, so nothing has to be
     translated anywhere. */
  const bits = new Map();
  for (const L of st.layers) bits.set(L.task, new Uint8Array(Math.ceil(L.segments.length / 8)));
  const isOn = (t, i) => (bits.get(t)[i >> 3] >> (i & 7)) & 1;
  const setOn = (t, i, on) => {
    const b = bits.get(t);
    if (on) b[i >> 3] |= 1 << (i & 7); else b[i >> 3] &= ~(1 << (i & 7));
  };

  /* Open with the most specific group lit - it is last in the paint order - so the
     first frame shows something without being 117 structures of mush. Arriving from a
     screen that is about one particular layer lights that one instead. */
  const last = (focus && st.layers.find(L => L.task === focus))
            || st.layers[st.layers.length - 1];
  if (last && last.segments.length <= 40) last.segments.forEach(s => setOn(last.task, s.i, true));

  /* ---- sidebar, built once and never rebuilt. Toggling flips a class and a byte, so
     the scroll position and whatever is typed in the search box always survive. */
  const rows = [];
  const tree = g("vtree");
  if (!st.layers.length) {
    tree.append($(`<div class="vempty">Nothing segmented yet — the CT still scrolls.</div>`));
  }
  for (const L of st.layers) {
    const grp = $(`<div class="vgrp"></div>`);
    const head = $(`<div class="vgrph">
      <span class="vcar">${L.segments.length > 20 ? "▸" : "▾"}</span>
      <span class="veye">●</span><span class="vname">${esc(L.task)}</span>
      <span class="vcount">${L.segments.length}</span></div>`);
    const body = $(`<div></div>`);
    if (L.segments.length > 20) body.classList.add("hide");
    for (const sg of L.segments) {
      const row = $(`<div class="vrow">
        <span class="veye">●</span>
        <span class="vsw" style="background:${esc(sg.color)}"></span>
        <span class="vname">${esc(sg.name)}</span></div>`);
      row.onclick = (e) => {
        if (e.shiftKey) {           /* solo within the group */
          L.segments.forEach(o => setOn(L.task, o.i, o.i === sg.i));
        } else {
          setOn(L.task, sg.i, !isOn(L.task, sg.i));
        }
        syncTree(); request();
      };
      rows.push({el: row, task: L.task, i: sg.i, name: sg.name.toLowerCase(), grp: grp});
      body.append(row);
    }
    head.onclick = (e) => {
      if (e.target.classList.contains("veye")) {   /* the eye toggles the whole task */
        const all = L.segments.every(o => isOn(L.task, o.i));
        L.segments.forEach(o => setOn(L.task, o.i, !all));
        syncTree(); request();
      } else {                                     /* anywhere else just collapses */
        body.classList.toggle("hide");
        head.querySelector(".vcar").textContent = body.classList.contains("hide") ? "▸" : "▾";
      }
    };
    grp.append(head, body);
    grp._head = head; grp._layer = L;
    tree.append(grp);
  }
  function syncTree() {
    for (const r of rows) r.el.classList.toggle("on", !!isOn(r.task, r.i));
    for (const grp of tree.querySelectorAll(".vgrp")) {
      const L = grp._layer, n = L.segments.filter(o => isOn(L.task, o.i)).length;
      grp._head.classList.toggle("on", n > 0);
      grp._head.querySelector(".vcount").textContent =
        n ? n + " / " + L.segments.length : L.segments.length;
    }
  }
  g("vq").oninput = (e) => {
    const q = e.target.value.trim().toLowerCase();
    for (const r of rows) r.el.hidden = !!q && !r.name.includes(q);
    for (const grp of tree.querySelectorAll(".vgrp")) {
      const body = grp.children[1];
      if (q) { body.classList.remove("hide"); grp._head.querySelector(".vcar").textContent = "▾"; }
      grp.hidden = !!q && !grp._layer.segments.some(
        o => o.name.toLowerCase().includes(q));
    }
  };
  const setAll = (on) => {
    for (const L of st.layers) L.segments.forEach(o => setOn(L.task, o.i, on));
    syncTree(); request();
  };
  g("vall").onclick = () => setAll(true);
  g("vnone").onclick = () => setAll(false);

  /* ---- plane and window buttons */
  const planeBtns = {}, preBtns = {};
  for (const p of PL) {
    const b = $(`<button class="ghost">${p}</button>`);
    b.onclick = () => { S.plane = p; S.mode = "2d"; paintChrome(); request(); stage.focus(); };
    planeBtns[p] = b; g("vplanes").append(b);
  }
  /* Probed once rather than on click, so an unsupported browser says so before you
     press it instead of showing a black rectangle. */
  const has3d = !!document.createElement("canvas").getContext("webgl2");
  const b3d = $(`<button class="ghost">3D</button>`);
  if (!has3d) { b3d.disabled = true; b3d.title = "this browser has no WebGL2"; }
  b3d.onclick = () => { S.mode = "3d"; paintChrome(); request(); };
  g("vplanes").append(b3d);
  for (const k of Object.keys(st.presets)) {
    const b = $(`<button class="ghost">${esc(k)}</button>`);
    b.onclick = () => { [S.ww, S.wl] = st.presets[k]; paintChrome(); request(); };
    preBtns[k] = b; g("vpre").append(b);
  }
  function paintChrome() {
    const gm = st.planes[S.plane];
    const sl = g("vsl");
    sl.max = gm.n - 1; sl.value = S.idx[S.plane];
    const d3 = S.mode === "3d";
    b3d.classList.toggle("ghost", !d3);
    g("vimg").classList.toggle("hide", d3);
    sl.classList.toggle("hide", d3);
    g("vpre").classList.toggle("hide", d3);
    if (cv3d) cv3d.classList.toggle("hide", !d3);
    g("vop").value = d3 ? S.op3 : S.op;
    g("vopv").textContent = (d3 ? S.op3 : S.op) + "%";
    if (d3) {
      g("vlabel").textContent = label3d;
      for (const p of PL) planeBtns[p].classList.add("ghost");
      return;
    }
    for (const p of PL) planeBtns[p].classList.toggle("ghost", p !== S.plane);
    for (const k of Object.keys(st.presets))
      preBtns[k].classList.toggle("ghost",
        !(st.presets[k][0] === Math.round(S.ww) && st.presets[k][1] === Math.round(S.wl)));
    g("vlabel").textContent = `${S.plane} ${S.idx[S.plane] + 1} / ${gm.n} · ` +
      `${gm.dir} · W ${Math.round(S.ww)} L ${Math.round(S.wl)}`;
  }

  /* ---- the image. One request in flight; the newest wanted URL wins when it lands.
     A timer debounce would either lag behind a fast drag or flood a slow one; this
     self-paces to whatever the server is actually managing. */
  const stage = g("vstage"), img = g("vimg"), busy = g("vbusy");
  let inflight = null, want = null, shown = "", busyT = null, dead = false;

  const sliceURL = (i) =>
    "/api/view/slice.png?name=" + encodeURIComponent(name) +
    "&case=" + encodeURIComponent(cse) + "&plane=" + S.plane +
    "&i=" + (i === undefined ? S.idx[S.plane] : i) +
    "&ww=" + Math.round(S.ww) + "&wl=" + Math.round(S.wl) + "&op=" + S.op +
    "&v=" + encodeURIComponent(vparam()) + "&s=" + st.stamp +
    "&token=" + encodeURIComponent(TOKEN);
  function vparam() {
    const out = [];
    for (const L of st.layers) {
      const b = bits.get(L.task);
      if (b.some(x => x)) out.push(L.task + ":" +
        Array.from(b, x => x.toString(16).padStart(2, "0")).join(""));
    }
    return out.join(",");
  }
  function showBusy(on) {
    clearTimeout(busyT);
    if (on) busyT = setTimeout(() => busy.classList.remove("hide"), 150);
    else busy.classList.add("hide");
  }
  function sizeSlice() {
    const gm = st.planes[S.plane], box = stage.getBoundingClientRect();
    /* One scale for both axes, from millimetres rather than pixels - that is what
       stops an anisotropic coronal from coming out squashed. */
    const s = Math.min((box.width - 20) / gm.mm_w, (box.height - 20) / gm.mm_h);
    img.style.width = (gm.mm_w * s) + "px";
    img.style.height = (gm.mm_h * s) + "px";
  }
  function fire(url) {
    const im = inflight = new Image();
    im.onload = () => {
      inflight = null;
      img.src = im.src;             /* already decoded and cached: no blank frame */
      shown = url; sizeSlice(); showBusy(false);
      if (want && want !== shown) fire(want); else preload();
    };
    im.onerror = () => {
      inflight = null; showBusy(false);
      if (!dead) { dead = true; g("vhead").append(err(new Error(
        "that slice could not be drawn - the files may have been rewritten by a run. " +
        "Reload the page."))); }
    };
    im.src = url; showBusy(true);
  }
  function request() {
    if (S.mode === "3d") { paintChrome(); return request3d(); }
    const url = sliceURL();
    paintChrome();
    if (url === shown) return;
    want = url;
    if (!inflight) fire(want);
  }
  /* ---- 3d mode. The sidebar, the bitsets and request() are all shared with the
     slice view, so the same eye icons drive both and switching tabs keeps your
     selection. What differs is that a structure is fetched once and then lives on the
     GPU, so toggling one back on costs nothing. */
  const MAX3D = 48;
  let v3d = null, cv3d = null, label3d = "", q3d = [], busy3d = 0, done3d = 0, cap3d = null;

  function want3d() {
    const out = [];
    for (const L of st.layers)
      for (const sg of L.segments)
        if (isOn(L.task, sg.i))
          out.push({task: L.task, i: sg.i, color: sg.color, key: L.task + "/" + sg.i});
    return out;
  }
  function meshURL(w) {
    return "/api/view/mesh.bin?name=" + encodeURIComponent(name) +
      "&case=" + encodeURIComponent(cse) + "&task=" + encodeURIComponent(w.task) +
      "&i=" + w.i + "&s=" + st.stamp + "&token=" + encodeURIComponent(TOKEN);
  }
  function note3d(text) {
    if (cap3d) { cap3d.remove(); cap3d = null; }
    if (text) { cap3d = $(`<div class="vcap">${esc(text)}</div>`); stage.append(cap3d); }
  }
  function request3d() {
    if (!v3d) {
      cv3d = $(`<canvas class="v3d" id="v3d"></canvas>`);
      stage.append(cv3d);
      v3d = makeViewer3D(cv3d);
      if (!v3d.ok) { note3d("This browser cannot show 3D (no WebGL2)."); return; }
      v3d.resize();
    }
    if (!v3d.ok) return;
    const want = want3d();
    if (want.length > MAX3D) {
      /* An arbitrary 48 of 117 is not a useful picture, so nothing is fetched and the
         message names the two controls that fix it - both of which already exist. */
      note3d("3D shows up to " + MAX3D + " structures at once, and " + want.length +
             " are switched on. Narrow it with the search box, or shift-click one " +
             "structure to show just that.");
      return;
    }
    note3d("");
    const keep = new Set(want.map(w => w.key));
    for (const k of v3d.keys()) if (!keep.has(k)) v3d.drop(k);
    v3d.setOpacity(S.op3 / 100);
    q3d = want.filter(w => !v3d.has(w.key));
    done3d = 0;
    pump3d();
    v3d.invalidate();
    tick3d();
  }
  function pump3d() {
    /* Four at a time: enough to use the cores, and they all block on the same cache
       entry for the underlying .seg.nrrd so it is still read exactly once. */
    while (busy3d < 4 && q3d.length) {
      const w = q3d.shift();
      busy3d++;
      fetch(meshURL(w), {headers: {"X-Token": TOKEN}})
        .then(r => r.ok ? r.arrayBuffer() : r.json().then(j => { throw new Error(j.error); }))
        .then(buf => { if (v3d && S.mode === "3d") v3d.add(w.key, buf, w.color); })
        .catch(e => {
          if (!dead) { dead = true; g("vhead").append(err(new Error(
            String(e.message || e).replace(/^\w*Error: /, "")))); }
        })
        .finally(() => { busy3d--; done3d++; pump3d(); tick3d(); });
    }
  }
  function tick3d() {
    const left = q3d.length + busy3d;
    label3d = left
      ? "building surfaces… " + done3d + " / " + (done3d + left)
      : "3D · " + v3d.keys().length + " structures · " +
        Math.round(v3d.triangles() / 1000) + "k triangles · drag to spin, " +
        "shift-drag to pan, scroll to zoom";
    if (S.mode === "3d") g("vlabel").textContent = label3d;
  }

  function preload() {
    const n = st.planes[S.plane].n;
    for (const d of [1, -1, 2, -2]) {
      const j = S.idx[S.plane] + d;
      if (j >= 0 && j < n) new Image().src = sliceURL(j);
    }
  }
  const step = (d) => {
    const n = st.planes[S.plane].n;
    S.idx[S.plane] = Math.max(0, Math.min(n - 1, S.idx[S.plane] + d));
    request();
  };

  g("vsl").oninput = (e) => { S.idx[S.plane] = +e.target.value; request(); };
  g("vop").oninput = (e) => {
    const v = +e.target.value;
    if (S.mode === "3d") { S.op3 = v; } else { S.op = v; }
    g("vopv").textContent = v + "%";
    request();
  };
  stage.addEventListener("wheel", (e) => {
    if (S.mode === "3d") return;   /* the canvas has its own wheel handler */
    e.preventDefault();            /* the page must not scroll under the cursor */
    step(Math.sign(e.deltaY));
  }, {passive: false});
  stage.onkeydown = (e) => {
    const k = e.key;
    if (k === "4") { S.mode = "3d"; paintChrome(); request(); e.preventDefault(); return; }
    if (S.mode === "3d") return;
    if (k === "ArrowDown" || k === "ArrowRight") step(1);
    else if (k === "ArrowUp" || k === "ArrowLeft") step(-1);
    else if (k === "PageDown") step(10);
    else if (k === "PageUp") step(-10);
    else if (k === "Home") { S.idx[S.plane] = 0; request(); }
    else if (k === "End") { S.idx[S.plane] = st.planes[S.plane].n - 1; request(); }
    else if ("123".includes(k)) { S.plane = PL[+k - 1]; paintChrome(); request(); }
    else return;
    e.preventDefault();
  };

  /* Window/level by dragging, the way every PACS does it: across for width, up and
     down for level. */
  let drag = null;
  stage.onpointerdown = (e) => {
    if (S.mode === "3d") return;
    drag = {x: e.clientX, y: e.clientY, ww: S.ww, wl: S.wl};
    stage.setPointerCapture(e.pointerId); stage.focus();
  };
  stage.onpointermove = (e) => {
    if (!drag) return;
    S.ww = Math.max(1, Math.min(4000, drag.ww + (e.clientX - drag.x) * 4));
    S.wl = Math.max(-1200, Math.min(3000, drag.wl - (e.clientY - drag.y) * 4));
    request();
  };
  const endDrag = (e) => {
    if (!drag) return;
    drag = null;
    try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
  };
  stage.onpointerup = endDrag;
  stage.onpointercancel = endDrag;
  stage.ondblclick = () => { [S.ww, S.wl] = st.presets[st.default]; request(); };

  /* The page is torn down by rewriting #view, which cannot detach this, so it checks
     whether it is still on screen and unhooks itself when it is not. */
  const onResize = () => {
    if (!document.body.contains(stage)) {
      window.removeEventListener("resize", onResize);
      if (v3d && v3d.ok) v3d.dispose();       /* release the GL context with the page */
      v3d = null;
    } else {
      sizeSlice();
      if (v3d && v3d.ok) v3d.resize();
    }
  };
  window.addEventListener("resize", onResize);

  syncTree(); paintChrome(); request(); stage.focus();
}

document.getElementById("navHome").onclick = () => nav("home");
document.getElementById("brand").onclick = () => nav("home");
route();
</script>
</body>
</html>
